name: Multi-User Auto Push

on:
  schedule:
    - cron: '2/5 * * * *'
  workflow_dispatch:
    inputs:
      check_only:
        description: 'Only check database connectivity and count due subscriptions (no delivery)'
        type: boolean
        default: true
  repository_dispatch:
    types: [supabase-auto-push]

permissions:
  contents: read

jobs:
  run-auto-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: multi-user-auto-push
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run due subscriptions
        env:
          AUTO_PUSH_DATABASE_URL: ${{ secrets.AUTO_PUSH_DATABASE_URL }}
          # GitHub-hosted runners use this project's IPv4 session pooler.
          AUTO_PUSH_SUPABASE_PROJECT_REF: "ypnykiqxwixaaixdcjbc"
          AUTO_PUSH_SUPABASE_SESSION_POOLER_HOST: "aws-0-us-west-2.pooler.supabase.com"
          AUTO_PUSH_MULTIUSER: "1"
          # Allow for GitHub schedule delays without changing subscription times.
          AUTO_PUSH_GRACE_MINUTES: "60"
          SERVER_PERSISTENCE: "0"
          CHECK_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.check_only }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          if [ -z "${AUTO_PUSH_DATABASE_URL}" ]; then
            echo "Missing GitHub secret: AUTO_PUSH_DATABASE_URL"
            exit 1
          fi
          if [ "${CHECK_ONLY}" = "true" ]; then
            python daily_push.py --check
          else
            python daily_push.py --all-due
          fi
